# Weekly dependency updates (#134), same policy as cas-lib. PR titles follow
# Conventional Commits so they pass the PR title check (#149):
# `chore(deps): ...` for crates, `chore(deps-dev): ...` for npm dev
# dependencies and `ci(deps): ...` for actions.
#
# Security updates for vulnerable dependencies, including transitive ones, come
# from Dependabot security updates (a repository setting), not from this file;
# the cargo audit / npm audit checks (#133) flag anything they miss.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a week after a release before proposing it, so a compromised or
    # broken release has time to be yanked. Security updates skip this.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Patch releases are semver-compatible even for 0.x crates: one PR a week.
      # Minor and major releases stay separate PRs, because for 0.x crates a
      # minor release is a breaking change that needs its own review.
      #
      # `cas-lib` is pinned with `=` in Cargo.toml, so every cas-lib release
      # (patch included) arrives as its own PR instead of being grouped: each
      # one changes the cryptography this SDK ships and gets its own review.
      cargo-patch:
        update-types:
          - "patch"
        exclude-patterns:
          - "cas-lib"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Minor and patch bumps of the build/test toolchain in one PR a week.
      # Major bumps stay separate PRs.
      npm-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # All action bumps in one PR. Dependabot updates the SHA pins (#135) and
      # keeps the `# vX.Y.Z` comment in step.
      github-actions:
        patterns:
          - "*"
