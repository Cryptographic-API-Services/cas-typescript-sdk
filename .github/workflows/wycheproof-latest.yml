# Runs the Wycheproof specs against the newest upstream vectors so new test
# cases surface without anyone re-vendoring files. PR builds stay on the commit
# pinned in scripts/fetch-wycheproof.mjs; bump it once this workflow is green.

name: Wycheproof (latest upstream)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "C2SP/wycheproof commit, tag, or branch"
        default: "main"

permissions:
  contents: read

jobs:
  wycheproof:
    runs-on: ubuntu-latest
    env:
      WYCHEPROOF_REF: ${{ inputs.ref || 'main' }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    - name: Resolve upstream commit
      run: |
        sha=$(git ls-remote https://github.com/C2SP/wycheproof "$WYCHEPROOF_REF" | head -n1 | cut -f1)
        echo "WYCHEPROOF_REF=${sha:-$WYCHEPROOF_REF}" >> "$GITHUB_ENV"
        echo "Testing against C2SP/wycheproof@${sha:-$WYCHEPROOF_REF}" >> "$GITHUB_STEP_SUMMARY"
    - run: npm run build:rust
    - run: npm run wycheproof:fetch
    - run: npx playwright test tests/wycheproof- --project=chromium
