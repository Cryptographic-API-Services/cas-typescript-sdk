# Cross-platform build and publish workflow
#
# Hardening:
# - The workflow grants nothing by default; each job asks for what it needs, and
#   only `publish` can mint an OIDC token (`id-token: write`).
# - Actions are pinned to commit SHAs, the Docker images to digests, and the
#   Node tarballs the containers install are checked against committed SHA-256s.
# - The Rust toolchain comes from rust-toolchain.toml and every build uses --locked.

name: Build and Publish

on:
  push:
    branches: [ "main" ]

permissions: {}

jobs:
  build-matrix:
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Images are pinned by digest, which Dependabot doesn't update in
          # `docker run`. Refresh with `docker buildx imagetools inspect <image>:<tag>`
          # (top-level Digest). Node tarball hashes come from the release's SHASUMS256.txt.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c # lts-debian
            node-tarball: https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
            node-sha256: 5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust@sha256:caac2d1b9194eada0c69e669e72763869701351d8957ab805cc45a43999d8be2 # lts-alpine
            # nodejs.org has no official musl build, so use the unofficial one.
            node-tarball: https://unofficial-builds.nodejs.org/download/release/v26.13.1/node-v26.13.1-linux-x64-musl.tar.xz
            node-sha256: 1b8a8a393c7fa5b2f66eaf0314aaa23c2f3cd3a3be14d5c7bac011bf9de236ea
          # Windows builds (on Windows)
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS builds (on macOS)
          - host: macos-latest
            target: x86_64-apple-darwin

    name: Build ${{ matrix.settings.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install toolchain from rust-toolchain.toml
        if: ${{ !matrix.settings.docker }}
        run: rustup toolchain install

      - name: Build in Docker
        if: ${{ matrix.settings.docker }}
        env:
          IMAGE: ${{ matrix.settings.docker }}
          TARGET: ${{ matrix.settings.target }}
          NODE_TARBALL: ${{ matrix.settings.node-tarball }}
          NODE_SHA256: ${{ matrix.settings.node-sha256 }}
        run: |
          docker run --rm -v "$(pwd)":/build -w /build \
            -e TARGET -e NODE_TARBALL -e NODE_SHA256 \
            "$IMAGE" sh -c '
            set -e

            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache openssl-dev pkgconf curl xz
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y pkg-config libssl-dev ca-certificates curl xz-utils
              rm -rf /var/lib/apt/lists/*
              export OPENSSL_INCLUDE_DIR=/usr/include
              export OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu
              unset X86_64_UNKNOWN_LINUX_GNU_OPENSSL_DIR
            else
              echo "No supported package manager found (apk/apt-get)."
              exit 1
            fi

            # Both images ship Node 18, too old for the current toolchain
            # (@napi-rs/cli/@inquirer need Node 20+). Install into a clean prefix
            # and prepend it to PATH instead of overlaying /usr/local (overlaying
            # mixes npm versions and breaks npm).
            curl -fsSL -o /tmp/node.tar.xz "$NODE_TARBALL"
            echo "$NODE_SHA256  /tmp/node.tar.xz" | sha256sum -c -
            mkdir -p /opt/node
            tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
            export PATH=/opt/node/bin:$PATH
            node -v && npm -v

            # The images predate rustup 1.28, where `rustup toolchain install`
            # first accepts no argument; this form installs rust-toolchain.toml on both.
            rustup show active-toolchain || rustup toolchain install

            npm ci &&
            npm run build:ts &&
            npx napi build --platform --release --target "$TARGET" -- --locked
          '

      - name: Build native
        if: ${{ !matrix.settings.docker }}
        run: |
          npm run build:ts
          npx napi build --platform --release --target ${{ matrix.settings.target }} -- --locked

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            index.js
            index.d.ts
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build-matrix]
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) - no NPM_TOKEN needed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: List binaries
        run: ls -la *.node

      - name: Verify package contents
        run: |
          echo "Checking package contents..."
          npm pack --dry-run
          echo "Verifying binary files..."
          ls -la *.node || echo "No .node files found!"

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@12.2.3

      # Authenticates via OIDC (trusted publisher configured on npmjs.com);
      # provenance attestations are attached automatically.
      - name: Publish to npm
        run: npm publish --access public
