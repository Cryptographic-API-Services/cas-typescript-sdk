# Pin the exact toolchain so CI, releases and local builds compile with the same
# compiler (#132), matching cas-lib. rustup installs it on first use. Bump it in
# its own PR.
#
# This file overrides any toolchain a workflow selects, so it must also list
# every release target in main-publish.yml or those builds lose their std.
[toolchain]
channel = "1.100.0"
profile = "minimal"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]
